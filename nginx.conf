server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Next.js export support for clean URLs:
        # e.g., /sobre looks for /sobre.html, then /sobre/index.html
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page generated by Next.js static export
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Redirect server errors to static page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
